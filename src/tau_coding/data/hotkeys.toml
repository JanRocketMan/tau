# Tau hotkey catalog: the single source of truth for every keyboard shortcut
# in the TUI. No hotkey is defined outside this file; the TUI builds its
# Textual bindings from it, and `TuiKeybindings` derives its defaults from it.
#
# Each [[keymaps]] block names a scope (screen, widget, or prompt mode).
# A binding entry is either:
#   - a definition (keymap "prompt" only): name, key, action, description
#   - a reference (all other keymaps): hotkey = <prompt entry name>, plus the
#     footer label as `description` and optional display extras
#
# Optional entry flags:
#   show      - whether the binding may appear in a Textual footer (default true)
#   priority  - whether the binding beats focused-widget key handling (default false)
#   bound     - whether the key is registered as a Textual binding; false means
#               the owning widget handles the key itself in on_key (default true)
#   key_display - footer text; {name} placeholders expand to that hotkey's key
#
# Keys use Textual's syntax ("ctrl+k", "shift+enter", "f1", ...).

schema_version = 1

# ---------------------------------------------------------------------------
# Prompt keymap: the definitions every other keymap references. These are the
# keys active at the main prompt and app-wide.
# ---------------------------------------------------------------------------

[[keymaps]]
name = "prompt"
description = "Main prompt input and app-wide actions"

[[keymaps.bindings]]
name = "submit"
key = "enter"
action = "submit_prompt"
description = "Submit the prompt to start a run or steer one that is active"

[[keymaps.bindings]]
name = "insert_newline"
key = "shift+enter"
action = "insert_newline"
description = "Insert a newline without submitting the prompt"

[[keymaps.bindings]]
name = "interrupt"
key = "ctrl+c"
action = "interrupt"
description = "Stop the active model run, tool, or compaction"

[[keymaps.bindings]]
name = "cancel"
key = "escape"
action = "cancel"
description = "Cancel the active run or close the focused overlay"

[[keymaps.bindings]]
name = "queue_follow_up"
key = "alt+enter"
action = "submit_follow_up"
description = "Queue a follow-up that waits until the current run stops"

[[keymaps.bindings]]
name = "command_palette"
key = "ctrl+k"
action = "open_command_palette"
description = "Open slash-command completions"

[[keymaps.bindings]]
name = "session_picker"
key = "ctrl+r"
action = "open_session_picker"
description = "Open the session picker"

[[keymaps.bindings]]
name = "open_context"
key = "ctrl+l"
action = "open_context"
description = "Open the active model context in the default editor"

[[keymaps.bindings]]
name = "accept_completion"
key = "tab"
action = "accept_completion"
description = "Accept the highlighted completion"

[[keymaps.bindings]]
name = "completion_next"
key = "down"
action = "completion_next"
description = "Select the next completion, or move down in the prompt"

[[keymaps.bindings]]
name = "completion_previous"
key = "up"
action = "completion_previous"
description = "Select the previous completion, or move up in the prompt"

[[keymaps.bindings]]
name = "thinking_cycle"
key = "ctrl+f"
action = "cycle_thinking"
description = "Cycle the thinking mode"

[[keymaps.bindings]]
name = "model_cycle"
key = "ctrl+p"
action = "cycle_model"
description = "Cycle through available models, default provider first"

[[keymaps.bindings]]
name = "toggle_thinking"
key = "ctrl+t"
action = "toggle_thinking"
description = "Toggle display of thinking tokens"

[[keymaps.bindings]]
name = "toggle_tool_results"
key = "ctrl+o"
action = "toggle_tool_results"
description = "Collapse or expand tool output"

[[keymaps.bindings]]
name = "clear_prompt"
key = "ctrl+u"
action = "clear_prompt"
description = "Clear the prompt input"

[[keymaps.bindings]]
name = "quit"
key = "ctrl+d"
action = "quit"
description = "Quit Tau"

