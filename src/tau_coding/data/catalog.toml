schema_version = 1

# Default provider/model used when no explicit selection is given.
default_provider = "openai-codex"

# Default web-search provider used by the optional `search` tool when the
# TAU_SEARCH_PROVIDER environment variable is unset.
default_search_provider = "parallel"

# Short display labels used in the model picker and provider badges.
[provider_labels]
openai-codex = "codex"
opencode-go = "go"

[[providers]]
name = "openai-codex"
display_name = "OpenAI Codex subscription"
kind = "openai-codex"
base_url = "https://chatgpt.com/backend-api"
api_key_env = "OPENAI_CODEX_ACCESS_TOKEN"
credential_name = "openai-codex"
auth_methods = ["oauth"]
models = ["gpt-6-luna", "gpt-6.1-sol"]
default_model = "gpt-6.1-sol"
docs_url = "https://chatgpt.com/codex"
thinking_parameter = "reasoning.effort"
timeout_seconds = 60.0
stream_idle_timeout_seconds = 600.0
max_retries = 2
max_retry_delay_seconds = 1.0
thinking_defaults = { "gpt-6-luna" = "xhigh", "gpt-6.1-sol" = "xhigh" }

[providers.context_windows]
"gpt-6-luna" = 272000
"gpt-6.1-sol" = 272000

[providers.model_metadata."gpt-6-luna"]
name = "GPT-6 Luna"
reasoning = true
input = ["text", "image"]
context_window = 272000
max_tokens = 128000
cost = { input = 0.1, output = 0.5, cacheRead = 0.01, cacheWrite = 0.125 }
thinking_default = "xhigh"
thinking_levels = ["medium", "xhigh"]

[providers.model_metadata."gpt-6.1-sol"]
name = "GPT-6.1 Sol"
reasoning = true
input = ["text", "image"]
context_window = 272000
max_tokens = 128000
cost = { input = 2, output = 10, cacheRead = 0.1, cacheWrite = 2.5 }
thinking_default = "xhigh"
thinking_levels = ["medium", "xhigh"]

[[providers]]
name = "opencode-go"
display_name = "OpenCode Go"
kind = "openai-compatible"
base_url = "https://opencode.ai/zen/go/v1"
api_key_env = "OPENCODE_API_KEY"
credential_name = "opencode"
models = ["deepseek-v4.1-flash", "mimo-v2.6-pro"]
default_model = "deepseek-v4.1-flash"
docs_url = "https://opencode.ai/docs/go"
api = "openai-completions"
thinking_parameter = "reasoning_effort"
timeout_seconds = 60.0
stream_idle_timeout_seconds = 600.0
max_retries = 3
max_retry_delay_seconds = 5.0
thinking_defaults = { "deepseek-v4.1-flash" = "max", "mimo-v2.6-pro" = "high" }
# OpenCode Go requires a stable per-conversation session header on every request.
compat = { sendSessionAffinityHeaders = true, sessionAffinityFormat = "opencode" }

[providers.context_windows]
"deepseek-v4.1-flash" = 1000000
"mimo-v2.6-pro" = 1048576

[providers.model_metadata."deepseek-v4.1-flash"]
input = ["text", "image"]
context_window = 1000000
max_tokens = 384000
cost = { input = 0.15, output = 0.6, cacheRead = 0.003, cacheWrite = 0.0 }
thinking_default = "max"
thinking_levels = ["high", "max"]
compat = { supportsStore = false, maxTokensField = "max_tokens", requiresReasoningContentOnAssistantMessages = true, thinkingFormat = "deepseek" }

[providers.model_metadata."mimo-v2.6-pro"]
input = ["text", "image"]
context_window = 1048576
max_tokens = 131072
cost = { input = 0.435, output = 0.87, cacheRead = 0.003625, cacheWrite = 0.0 }
thinking_default = "high"
thinking_levels = ["low", "medium", "high"]
# This model rejects the `thinking` envelope and the `max`/`xhigh`/`minimal`
# efforts; plain `reasoning_effort` with low/medium/high works.
compat = { supportsStore = false, maxTokensField = "max_tokens", requiresReasoningContentOnAssistantMessages = true }

# Web-search providers for the optional `search` tool. Select a provider by
# setting TAU_SEARCH_PROVIDER; when unset, default_search_provider wins.
# The API key env var listed for each provider is read from the process
# environment at session startup.

[[search_providers]]
name = "parallel"
display_name = "Parallel Search"
api_key_env = "PARALLEL_SEARCH_API_KEY"
endpoint = "https://api.parallel.ai/v1/search"
docs_url = "https://docs.parallel.ai/api-reference/search/search"
modes = ["turbo", "fast", "basic", "advanced"]
default_mode = "fast"
timeout_env = "PARALLEL_SEARCH_TIMEOUT_SECONDS"

[[search_providers]]
name = "brave"
display_name = "Brave Search"
api_key_env = "BRAVE_SEARCH_API_KEY"
endpoint = "https://api.search.brave.com/res/v1/web/search"
docs_url = "https://brave.com/search/api/"
timeout_env = "BRAVE_SEARCH_TIMEOUT_SECONDS"
