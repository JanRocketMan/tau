schema_version = 1

# Default web-search provider used by the optional `search` tool when the
# TAU_SEARCH_PROVIDER environment variable is unset.
default_search_provider = "parallel"

[[providers]]
name = "openai-codex"
display_name = "OpenAI Codex subscription"
kind = "openai-codex"
base_url = "https://chatgpt.com/backend-api"
api_key_env = "OPENAI_CODEX_ACCESS_TOKEN"
credential_name = "openai-codex"
auth_methods = ["oauth"]
models = ["gpt-5.6-luna", "gpt-5.6-sol"]
default_model = "gpt-5.6-luna"
docs_url = "https://chatgpt.com/codex"
thinking_parameter = "reasoning.effort"

[providers.context_windows]
"gpt-5.6-luna" = 272000
"gpt-5.6-sol" = 272000

[providers.model_metadata."gpt-5.6-luna"]
name = "GPT-5.6 Luna"
reasoning = true
input = ["text", "image"]
context_window = 272000
max_tokens = 128000
cost = { input = 0.2, output = 1.2, cacheRead = 0.02, cacheWrite = 0.25 }
thinking_default = "xhigh"
thinking_levels = ["low", "medium", "high", "xhigh"]

[providers.model_metadata."gpt-5.6-sol"]
name = "GPT-5.6 Sol"
reasoning = true
input = ["text", "image"]
context_window = 272000
max_tokens = 128000
cost = { input = 5, output = 30, cacheRead = 0.5, cacheWrite = 6.25 }
thinking_default = "xhigh"
thinking_levels = ["low", "medium", "high", "xhigh"]

[[providers]]
name = "opencode-go"
display_name = "OpenCode Go"
kind = "openai-compatible"
base_url = "https://opencode.ai/zen/go/v1"
api_key_env = "OPENCODE_API_KEY"
credential_name = "opencode"
models = ["gpt-5.6-luna", "deepseek-v4-flash"]
default_model = "deepseek-v4-flash"
docs_url = "https://opencode.ai/docs/go"
api = "openai-completions"
thinking_parameter = "reasoning_effort"

[providers.context_windows]
"gpt-5.6-luna" = 1000000
"deepseek-v4-flash" = 1000000

[providers.model_metadata."gpt-5.6-luna"]
api = "openai-responses"
input = ["text", "image"]
context_window = 1000000
max_tokens = 128000
cost = { input = 0.2, output = 1.2, cacheRead = 0.02, cacheWrite = 0.25 }
thinking_default = "xhigh"
thinking_levels = ["low", "medium", "high", "xhigh", "max"]

[providers.model_metadata."deepseek-v4-flash"]
input = ["text"]
context_window = 1000000
max_tokens = 384000
cost = { input = 0.14, output = 0.28, cacheRead = 0.028, cacheWrite = 0.0 }
thinking_default = "max"
thinking_levels = ["high", "max"]

# Web-search providers for the optional `search` tool. Select a provider by
# setting TAU_SEARCH_PROVIDER; when unset, default_search_provider wins.
# The API key env var listed for each provider is read from the process
# environment at session startup.

[[search_providers]]
name = "parallel"
display_name = "Parallel Search"
api_key_env = "PARALLEL_SEARCH_API_KEY"
endpoint = "https://api.parallel.ai/v1/search"
docs_url = "https://docs.parallel.ai/api-reference/search/search"
modes = ["turbo", "fast", "basic", "advanced"]
default_mode = "fast"
timeout_env = "PARALLEL_SEARCH_TIMEOUT_SECONDS"

[[search_providers]]
name = "brave"
display_name = "Brave Search"
api_key_env = "BRAVE_SEARCH_API_KEY"
endpoint = "https://api.search.brave.com/res/v1/web/search"
docs_url = "https://brave.com/search/api/"
timeout_env = "BRAVE_SEARCH_TIMEOUT_SECONDS"
